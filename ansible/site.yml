- name: Preparar servidor de aplicacion
  hosts: web
  become: true
  vars:
    # El hash se entrega por variable de entorno; no se guarda en el repositorio.
    jvl_password_hash: "{{ lookup('ansible.builtin.env', 'JVL_PASSWORD_HASH') }}"
  tasks:
    - name: Instalar paquetes
      ansible.builtin.apt:
        name: [curl, openjdk-8-jdk]
        state: present

    - name: Descargar script
      ansible.builtin.get_url:
        url: https://example.com/setup.sh
        dest: /opt/setup.sh
        mode: "0750"

    - name: Ejecutar script
      ansible.builtin.command: /opt/setup.sh
      changed_when: false

    - name: Crear usuario de aplicacion
      ansible.builtin.user:
        name: jvl
        password: "{{ jvl_password_hash }}"
